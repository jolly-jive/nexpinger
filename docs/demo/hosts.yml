hosts:
  - name: cloudflare
    address: 1.1.1.1
    items:
      - name: ping
        type: icmp
        interval: 1000
      - name: dns
        type: udp
        service: dns
        interval: 2000
  - name: google
    address: 8.8.8.8
    items:
      - name: ping
        type: icmp
        interval: 1000
  - name: example
    address: example.com
    items:
      - name: https
        type: tcp
        port: 443
        interval: 2000
  - name: unreachable
    address: 192.0.2.1
    items:
      - name: ping
        type: icmp
        interval: 2000
        timeout: 500
