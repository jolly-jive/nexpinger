# ExPing Next (Elixir版) - 監視対象ホスト定義
#
# hosts[].items[] に監視項目を定義
# item.type: icmp | tcp (tcp の場合は port が必須)
# item.interval: 監視間隔 (ミリ秒)
# item.timeout:  応答待ちタイムアウト (ミリ秒) ※省略時は 1000

hosts:
  - name: gateway
    address: 192.168.1.1
    items:
      - name: ping
        type: icmp
        interval: 1000

  - name: dns-server
    address: 192.168.1.10
    items:
      - name: ping
        type: icmp
        interval: 2000
        timeout: 500

  - name: web-service
    address: example.com
    items:
      - name: https
        type: tcp
        port: 443
        interval: 3000
        timeout: 1000
      - name: http
        type: tcp
        port: 80
        interval: 3000
        timeout: 1000
