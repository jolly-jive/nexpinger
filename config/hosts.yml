# NexPinger (Elixir) - monitored hosts
#
# Define checks in hosts[].items[]
# item.type: icmp | tcp (tcp requires port)
# item.interval: check interval (ms)
# item.timeout:  reply timeout (ms), default 1000

hosts:
  - name: gateway
    address: 192.168.1.1
    items:
      - name: ping
        type: icmp
        interval: 1000

  - name: dns-server
    address: 192.168.1.10
    items:
      - name: ping
        type: icmp
        interval: 2000
        timeout: 500

  - name: web-service
    address: example.com
    items:
      - name: https
        type: tcp
        port: 443
        interval: 3000
        timeout: 1000
      - name: http
        type: tcp
        port: 80
        interval: 3000
        timeout: 1000
