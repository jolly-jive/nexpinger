# ExPing Next (Elixir版) - 監視対象ホスト定義
#
# type: icmp | tcp
# tcp の場合は port が必須
# interval: 監視間隔 (ミリ秒)
# timeout:  応答待ちタイムアウト (ミリ秒) ※省略時は 1000

hosts:
  - name: gateway
    address: 192.168.1.1
    type: icmp
    interval: 1000

  - name: dns-server
    address: 192.168.1.10
    type: icmp
    interval: 2000
    timeout: 500

  - name: web-service
    address: example.com
    type: tcp
    port: 443
    interval: 3000
    timeout: 1000
