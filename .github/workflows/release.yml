# Builds the escript and the Burrito binaries (Windows, Linux) on a version tag push,
# then attaches them to a draft GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  escript:
    runs-on: ubuntu-latest
    # Not prod: Burrito (prod only) would be embedded in the escript
    env:
      MIX_ENV: escript
    steps:
      - uses: actions/checkout@v7

      # Oldest OTP that Elixir 1.20 supports, so the escript runs on more systems
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.20"

      - run: mix deps.get
      - run: mix compile

      - name: Check tag matches mix.exs version
        run: |
          version=$(mix run --no-compile --no-start -e 'IO.write(Mix.Project.config()[:version])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mix.exs version $version"
            exit 1
          fi

      - run: mix test
        env:
          MIX_ENV: test

      - run: mix escript.build

      - uses: actions/upload-artifact@v7
        with:
          name: escript
          path: nexpinger
          if-no-files-found: error

  # All Burrito binaries are cross-built here: Windows, Linux x86_64 and Linux aarch64
  burrito:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7

      # Burrito bundles this ERTS version (Linux: its own musl build of it).
      # OTP 27 on Windows breaks raw key input and BEL output.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      # Burrito 1.6 requires exactly this Zig version
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Burrito needs xz and 7z for Windows targets
      - run: sudo apt-get update && sudo apt-get install -y xz-utils p7zip-full

      - run: mix deps.get

      - run: mix test
        env:
          MIX_ENV: test

      # No BURRITO_TARGET: builds every target
      - run: mix release

      # Keys and signals on a pseudo terminal, against the x86_64 binary
      - run: mix test --only burrito
        env:
          MIX_ENV: test

      - run: |
          mkdir dist
          cp burrito_out/nexpinger_windows.exe dist/nexpinger.exe
          cp burrito_out/nexpinger_linux_x86_64 dist/nexpinger-linux-x86_64
          cp burrito_out/nexpinger_linux_aarch64 dist/nexpinger-linux-aarch64

      - uses: actions/upload-artifact@v7
        with:
          name: burrito
          path: dist/*
          if-no-files-found: error

  # The aarch64 binary can't run on the build machine, so test it on an ARM runner
  burrito-aarch64:
    needs: burrito
    runs-on: ubuntu-24.04-arm
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/download-artifact@v8
        with:
          name: burrito
          path: dist

      # Artifacts lose the executable bit
      - run: |
          mkdir burrito_out
          cp dist/nexpinger-linux-aarch64 burrito_out/nexpinger_linux_aarch64
          chmod +x burrito_out/nexpinger_linux_aarch64

      - run: burrito_out/nexpinger_linux_aarch64 --version

      - run: mix deps.get
      - run: mix test --only burrito

  release:
    needs: [escript, burrito, burrito-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The binaries include third-party code; ship its notices with them
      - run: cp LICENSE NOTICE THIRD_PARTY_NOTICES dist/

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
